name: AJN PDF Native Build

on:
  workflow_dispatch:
  push:
    branches: [feature/ajn-pdf-flutter]
    paths:
      - 'mobile/**'
      - '.github/workflows/ajn-pdf-native-build.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'
  AJN_API_BASE_URL: ${{ vars.AJN_API_BASE_URL || 'https://ajn-pdf-api-rswf5f4f3q-el.a.run.app' }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify production backend
        run: |
          echo "$AJN_API_BASE_URL" | grep -q '^https://'
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$AJN_API_BASE_URL/ready" > /dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$AJN_API_BASE_URL/api/tools" > /dev/null
      - run: python tool/bootstrap.py
      - run: flutter build apk --release --dart-define=AJN_API_BASE_URL="$AJN_API_BASE_URL"
      - run: flutter build appbundle --release --dart-define=AJN_API_BASE_URL="$AJN_API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: AJN-PDF-Android
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify production backend
        shell: pwsh
        run: |
          if (-not $env:AJN_API_BASE_URL.StartsWith('https://')) { throw 'AJN_API_BASE_URL must use HTTPS.' }
          Invoke-RestMethod "$env:AJN_API_BASE_URL/ready" | Out-Null
          Invoke-RestMethod "$env:AJN_API_BASE_URL/api/tools" | Out-Null
      - run: python tool/bootstrap.py
      - run: flutter build windows --release --dart-define=AJN_API_BASE_URL="$env:AJN_API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: AJN-PDF-Windows
          path: mobile/build/windows/x64/runner/Release/**

  ios-unsigned:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify production backend
        run: |
          echo "$AJN_API_BASE_URL" | grep -q '^https://'
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$AJN_API_BASE_URL/ready" > /dev/null
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$AJN_API_BASE_URL/api/tools" > /dev/null
      - run: python3 tool/bootstrap.py
      - run: flutter build ios --release --no-codesign --dart-define=AJN_API_BASE_URL="$AJN_API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: AJN-PDF-iOS-Unsigned
          path: mobile/build/ios/iphoneos/Runner.app/**
