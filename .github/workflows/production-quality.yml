name: AJN PDF production quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ajn-production-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-frontend-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:dependency-policy
      - run: npm run verify:secrets
      - run: npm run verify:r18-production
      - run: npm run verify:r17-trust-seo
      - run: npm run verify:r16-consistency
      - run: npm run verify:tool-ux
      - run: npm run verify:final-ui
      - run: npm run verify:mobile-first
      - run: npm run verify:i18n
      - run: npm run verify:accessibility
      - run: npm run verify:capabilities
      - run: npm run verify:backend-workflow
      - run: node scripts/verify-r20-conversion-accuracy.mjs
      - run: npm run verify:r19-release
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:r13-browser-pdf
      - run: npm run build
      - run: npm run verify:r13-runtime
      - run: python -m py_compile backend/app/main.py backend/app/conversion_engine.py backend/app/processing_quality.py backend/app/r19_fidelity.py backend/app/image_pdf_quality.py backend/app/job_worker.py backend/app/recognition_auto.py backend/app/api_access.py backend/app/platform_routes.py backend/app/recognition_deep.py backend/app/recognition_selected.py backend/app/e_signature_service.py backend/app/public_media.py backend/capability_audit.py backend/conversion_contract_audit.py backend/full_acceptance_test.py backend/processing_quality_acceptance_test.py backend/image_pdf_quality_acceptance_test.py backend/hard_format_acceptance_test.py backend/recognition_language_gate.py backend/recognition_multilingual_acceptance_test.py backend/api_v1_contract_test.py backend/recognition_deep_acceptance_test.py backend/recognition_selected_acceptance_test.py backend/e_signature_acceptance_test.py backend/r19_conversion_fidelity_acceptance_test.py

# Native LibreOffice/Calibre output acceptance remains a Docker/Cloud Run release gate.
