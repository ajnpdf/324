name: AJN PDF production quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ajn-production-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-frontend-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:dependency-policy
      - run: npm run verify:secrets
      - run: npm run verify:r18-production
      - run: npm run verify:r17-trust-seo
      - run: npm run verify:r16-consistency
      - run: npm run verify:tool-ux
      - run: npm run verify:final-ui
      - run: npm run verify:mobile-first
      - run: npm run verify:i18n
      - run: npm run verify:accessibility
      - run: npm run verify:capabilities
      - run: npm run verify:backend-workflow
      - run: node scripts/verify-r20-conversion-accuracy.mjs
      - run: npm run verify:r19-release
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:r13-browser-pdf
      - run: npm run build
      - run: npm run verify:r13-runtime
      - name: Compile current backend Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          files = sorted(Path('backend').rglob('*.py'))
          if not files:
              raise SystemExit('No backend Python files found.')

          for file in files:
              py_compile.compile(str(file), doraise=True)

          print(f'PASS: compiled {len(files)} current backend Python files.')
          PY

# Native LibreOffice/Calibre output acceptance remains a Docker/Cloud Run release gate.
