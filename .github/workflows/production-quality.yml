name: AJN PDF production quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ajn-production-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-frontend-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:dependency-policy
      - run: npm run verify:secrets
      - run: npm run verify:r18-production
      - run: npm run verify:r17-trust-seo
      - run: npm run verify:r16-consistency
      - run: npm run verify:tool-ux
      - run: npm run verify:final-ui
      - run: npm run verify:mobile-first
      - run: npm run verify:i18n
      - run: npm run verify:accessibility
      - run: npm run verify:capabilities
      - run: npm run verify:backend-workflow
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:r13-browser-pdf
      - run: npm run build
      - run: npm run verify:r13-runtime
      - run: python -m py_compile backend/app/main.py backend/app/conversion_engine.py backend/app/job_worker.py

# Native LibreOffice/Tesseract/Calibre output acceptance remains a Docker/Cloud Run release gate.
