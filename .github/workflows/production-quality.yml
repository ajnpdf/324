name: AJN PDF production quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/mcp-integration, feature/processing-quality-r15]
jobs:
  source-and-frontend-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/verify-r16-consistency.mjs
      - run: node scripts/verify-capability-manifest.mjs
      - run: node scripts/verify-backend-workflow.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:r13-browser-pdf
      - run: npm run build
      - run: npm run verify:r13-runtime
      - run: python -m py_compile backend/app/main.py backend/app/conversion_engine.py backend/app/processing_quality.py backend/app/image_pdf_quality.py backend/app/job_worker.py backend/app/api_access.py backend/app/platform_routes.py backend/app/ocr_deep.py backend/app/ocr_selected.py backend/app/e_signature_service.py backend/capability_audit.py backend/conversion_contract_audit.py backend/full_acceptance_test.py backend/processing_quality_acceptance_test.py backend/image_pdf_quality_acceptance_test.py backend/hard_format_acceptance_test.py backend/ocr_language_gate.py backend/ocr_multilingual_acceptance_test.py backend/api_v1_contract_test.py backend/ocr_deep_acceptance_test.py backend/ocr_selected_acceptance_test.py backend/e_signature_acceptance_test.py backend/app/mcp_server.py backend/app/mcp_entrypoint.py backend/mcp_smoke_test.py backend/mcp_auth_smoke_test.py
# Native LibreOffice/Tesseract/Calibre, API scope/rate contracts, six-language OCR,
# deep OCR layout/selected-page semantics, electronic-signature evidence, hard-format
# codecs and semantic processing output acceptance remain Docker/Cloud Run release gates.