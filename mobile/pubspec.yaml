name: ajnpdf
description: AJN PDF native app for Android, iOS and Windows.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  dio: ^5.11.0
  file_picker: ^11.0.3
  share_plus: ^13.3.0
  cross_file: ^0.3.5+4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
